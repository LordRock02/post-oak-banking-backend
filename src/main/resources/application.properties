spring.application.name=hexagonalarchitecture

# ===== DATASOURCE =====
# Si existe DB_URL la usa (Render), si no, usa localhost
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/usuarios_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ===== JPA / HIBERNATE =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== POSTGRES =====
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===== SERVER =====
# Render asigna el puerto dinamicamente. Localmente usara 8080.
server.port=${PORT:8080}